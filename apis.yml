aid: aladdin-b2b
name: Aladdin B2B
description: Aladdin B2B is a business-to-business matchmaking and meetings platform that helps enterprises,
  event organizers, government trade-promotion agencies, and trade shows create qualified B2B meetings that
  lead to transactions. Combining human expertise with artificial intelligence, Aladdin matches buyers and
  sellers based on their stated needs and hundreds of intelligent signals, then organizes pre-qualified,
  structured meetings and gives both parties the context they need beforehand. The platform is delivered
  through the Aladdin mobile app and the Aladdin Wish Chrome extension, with particular strength across the
  Middle East and Africa. Aladdin B2B is a portfolio company of 500 Global.
